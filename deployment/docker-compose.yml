version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: smartgov-postgres
    restart: always
    environment:
      POSTGRES_USER: smartgov_user
      POSTGRES_PASSWORD: smartgov_pass
      POSTGRES_DB: smartgovai_prod
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartgov_user -d smartgovai_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smartgov_net

  redis:
    image: redis:7-alpine
    container_name: smartgov-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartgov_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: smartgov-backend
    restart: always
    env_file:
      - ../backend/.env.production
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartgov_net

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: smartgov-ai-service
    restart: always
    env_file:
      - ../ai-service/.env.production
    ports:
      - "8000:8000"
    networks:
      - smartgov_net

  whatsapp-bot:
    build:
      context: ../whatsapp-bot
      dockerfile: Dockerfile
    container_name: smartgov-whatsapp-bot
    restart: always
    env_file:
      - ../whatsapp-bot/.env.production
    ports:
      - "5001:5001"
    depends_on:
      - backend
    networks:
      - smartgov_net

  web-admin:
    build:
      context: ../web-admin
      dockerfile: Dockerfile
    container_name: smartgov-web-admin
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - smartgov_net

networks:
  smartgov_net:
    driver: bridge

volumes:
  postgres_data:
