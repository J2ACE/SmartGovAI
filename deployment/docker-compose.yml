version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: smartgov-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: smartgovai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smartgov-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: smartgov-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/smartgovai?schema=public"
      JWT_SECRET: "prod-jwt-secret-smartgovai-2026"
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: smartgov-ai-service
    restart: always
    ports:
      - "8000:8000"

volumes:
  postgres_data:
