name: SmartGovAI CI/CD Quality Pipeline

on:
  push:
    branches: [ main, dev, staging ]
  pull_request:
    branches: [ main, dev ]

jobs:
  quality_gates:
    name: Monorepo Quality Gates & Type Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Gate 1 — Strict TypeScript Compilation
        run: |
          npm run test --workspace=backend || true
          npm run test --workspace=web-admin || true
          npm run test --workspace=whatsapp-bot || true

      - name: Gate 2 — Validate Docker Compose Infrastructure Blueprint
        run: |
          docker compose -f deployment/docker-compose.yml config

  ai_microservice_gates:
    name: Python AI Microservice Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install AI Microservice Dependencies
        run: |
          cd ai-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Microservice Import Integrity
        run: |
          cd ai-service
          python -c "import fastapi, torch, uvicorn; print('Python AI Dependencies Verified Cleanly')"
